name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Keep the external schema validator reproducible; update deliberately.
  CLAUDE_CODE_VERSION: 2.1.226

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Strict Claude plugin manifest
        run: |
          npx --yes @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION} plugin validate --strict .claude-plugin/marketplace.json
          plugin_tmp=$(mktemp -d)
          cp -R . "$plugin_tmp/plugin"
          rm -f "$plugin_tmp/plugin/CLAUDE.md"
          npx --yes @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION} plugin validate --strict "$plugin_tmp/plugin/.claude-plugin/plugin.json"
      - name: Strict Claude marketplace manifest
        run: npx --yes @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION} plugin validate --strict .claude-plugin/marketplace.json
      - name: Offline metadata and README inventory
        run: npm run validate
      - name: Tests
        run: npm test
